Host vmx? srv? 192.168.0.*
    ProxyJump omega
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    ServerAliveInterval 20
    ServerAliveCountMax 3

Host vmx1
    HostName 192.168.0.1

Host vmx2
    HostName 192.168.0.2

Host srv1
    HostName 192.168.0.11

Host srv2
    HostName 192.168.0.12
